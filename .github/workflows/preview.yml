name: Preview APK

# A build to actually run on a phone, without cutting a release.
#
# Why this exists: android.yml builds assembleProdDebug, and a debug build is
# the slow one — no R8, every composable in the shape the compiler emits in
# debug, resource shrinking off. On a fast phone that reads as jank. This job
# builds exactly what a release ships (prodRelease, R8, shrunk resources) and
# attaches it to the run, so `Actions -> Preview APK -> Run workflow -> the
# artifact at the bottom of the run` gives you a smooth build in one click.
#
# Signing: with KEYSTORE_BASE64 set it is signed with your real release key, so
# it installs over a released build like any update. Without it, a throwaway key
# is generated per run and the APK is installable on its own as long as nothing
# else signed differently is installed under the same package.
on:
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # A hung native build otherwise sits there for the six-hour default.
    timeout-minutes: 45
    env:
      # The one place the preview's ABI is named: the build asks Gradle for it
      # and the naming step labels the file with it.
      PREVIEW_ABI: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Keeps the Gradle build cache between runs — the second preview of the
      # same app is materially faster than the first.
      - uses: gradle/actions/setup-gradle@v4

      # A release build cannot be left unsigned (it would install nothing), so
      # this always writes keystore.properties — with the repo's key when there
      # is one, and with a per-run key when there is not.
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > lossless-release.jks
            for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions."
                exit 1
              fi
            done
            if ! keytool -list -keystore lossless-release.jks \
                -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error::That keystore opens, but alias \"$KEY_ALIAS\" is not in it with that password. Check KEY_ALIAS and KEY_PASSWORD."
              exit 1
            fi
            echo "::notice::Keystore, password and alias all check out."
            store_pass="$KEYSTORE_PASSWORD"
            alias="$KEY_ALIAS"
            key_pass="$KEY_PASSWORD"
            echo "::notice::Signed with the repository's release key."
          else
            keytool -genkeypair -keystore lossless-release.jks \
              -storepass previewpreview -keypass previewpreview \
              -alias preview -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Lossless preview" > /dev/null 2>&1
            store_pass=previewpreview
            alias=preview
            key_pass=previewpreview
            echo "::warning::No KEYSTORE_BASE64 secret — this APK is signed with a throwaway key. Uninstall any other Lossless before installing it, and uninstall it again before installing a release build."
          fi
          {
            echo "storeFile=lossless-release.jks"
            echo "storePassword=$store_pass"
            echo "keyAlias=$alias"
            echo "keyPassword=$key_pass"
          } > keystore.properties

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          # No sdk.dir line: the runner exports ANDROID_HOME/ANDROID_SDK_ROOT and
          # settings.gradle.kts reads those itself. An empty sdk.dir here would
          # make it think this machine has no SDK and skip :app entirely.
          : > local.properties
          [ -n "${LASTFM_API_KEY:-}" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          [ -n "${LASTFM_SECRET:-}" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
          [ -n "${LISTEN_TOGETHER_SERVER:-}" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties
          exit 0

      # arm64 only. Every phone this is tested on is arm64, and the native
      # build is the slowest part of the job — three ABIs of ONNX Runtime,
      # FFmpeg and the analyser take roughly three times as long as one. Release
      # still builds all three; this one only has to produce something to hold.
      #
      # Two things about `android.injected.build.abi`, both of which cost a run
      # to learn:
      #
      # 1. It is Android Studio's flag, so AGP builds the way Studio does and
      #    writes the APK to `build/intermediates/apk/<variant>/`, not to
      #    `build/outputs/apk/<flavour>/<type>/`. The APK was always there; the
      #    upload was looking in the wrong half of `build/`.
      # 2. Studio's deploy builds are marked `android:testOnly="true"` in the
      #    manifest, and the package installer refuses those — "App not
      #    installed", or "package appears to be invalid". `testOnly=false`
      #    keeps the optimised build but drops the marking.
      - name: Build the optimised APK
        run: |
          chmod +x gradlew
          ./gradlew assembleProdRelease \
            -Pandroid.injected.build.abi=${PREVIEW_ABI:-arm64-v8a} \
            -Pandroid.injected.testOnly=false \
            -x lintVitalProdRelease

      # Named after the release assets, so testing a preview and then receiving
      # the same version through the in-app updater are the same install.
      #
      # Found, not assumed. This step has now been wrong twice: first it globbed
      # `outputs/apk/prod/release/*.apk` and `nullglob` swallowed the miss, then
      # it searched `build/outputs` and still found nothing, because an injected
      # build writes under `build/intermediates/apk`. It now looks in both
      # places, prints every APK it sees and the ABIs inside each one, so the
      # log answers the question instead of the next run having to.
      - name: Collect the APKs
        id: apks
        run: |
          version="$(sed -n 's/^extra\["losslessVersionName"\] = "\([^"]*\)".*/\1/p' build.gradle.kts)"
          echo "Version: '$version'"
          if [ -z "$version" ]; then
            echo "::error::Could not read losslessVersionName from build.gradle.kts."
            exit 1
          fi

          apks="$(find app/build/outputs/apk app/build/intermediates/apk \
                    -type f -name '*.apk' 2>/dev/null | sort)"
          if [ -z "$apks" ]; then
            echo "::error::No APK under outputs/ or intermediates/. Full tree:"
            find app/build -maxdepth 4 | head -80
            exit 1
          fi

          mkdir -p out
          while IFS= read -r apk; do
            base="$(basename "$apk" .apk)"
            # AGP puts the ABI in the middle of the file name
            # (app-arm64-v8a-prod-release.apk); the updater wants it at the end.
            # A single-ABI IDE build does not put it in the name at all, so fall
            # back to the ABI that was asked for when there is only one inside.
            name="Lossless-$version-${PREVIEW_ABI:-arm64-v8a}.apk"
            for abi in armeabi-v7a arm64-v8a; do
              case "$base" in
                *"$abi"*) name="Lossless-$version-$abi.apk" ;;
              esac
            done
            cp "$apk" "out/$name"
            natives="$(unzip -l "$apk" 2>/dev/null | grep -o 'lib/[^/]*' | sort -u | tr '\n' ' ')"
            echo "  $apk -> out/$name  [${natives:-no native libs}]"
          done <<< "$apks"
          ls -l out/
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: Lossless-${{ steps.apks.outputs.version }}-preview
          # The directory, not a glob: a glob that misses is reported as an
          # empty artifact, while a directory that is missing says so.
          path: out/
          if-no-files-found: error
          # Three days. Artifacts are the one thing here that costs quota:
          # they are kept out of the 500 MB a free account gets, and an APK is
          # 56 MB, so a fortnight of previews is gigabytes. The run that
          # produced it has to survive long enough to be installed from, and
          # nothing longer. A release's APKs are release *assets*, which are
          # not counted against this at all.
          retention-days: 3
