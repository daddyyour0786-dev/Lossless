name: Android APK (manual build)

# A build you can trigger by hand from the Actions tab, for an APK to sideload
# when no release is wanted.
#
# Manual only, on purpose. It used to run on every push to main as well, which
# meant each push started a second full build of the app — C++, ONNX, three ABIs
# — for a debug APK nobody had asked for, next to the one Check was building.
# What a push needs to answer is "does this still compile", and Check answers it
# with unit tests in a fraction of the time.
#
# Shipping is .github/workflows/release.yml's job, on a tag — that is the only
# place a version that installed copies will be offered comes from.

on:
  workflow_dispatch:

# One at a time per ref: a queue of near-identical builds helps nobody.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Reads and writes the Gradle build cache, so a second build of the same
      # app reuses what the first one compiled instead of starting over.
      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships an Android SDK but not always this build's pieces.
      # sdkmanager is not on PATH in the runner's shell, so it is located
      # explicitly; if that fails at all, Gradle's own download is what actually
      # installs NDK and CMake on this project (it did, on the first run).
      - name: Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDK" ] || SDK="$(command -v sdkmanager || true)"
          if [ -x "$SDK" ]; then
            "$SDK" --install "platforms;android-37" "build-tools;37.0.0" \
              "cmake;3.22.1" "ndk;27.0.12077973" > /dev/null 2>&1 \
              || echo "::warning::sdkmanager installed only some of it — Gradle fetches the rest."
          else
            echo "::notice::No sdkmanager on PATH — Gradle fetches SDK, NDK and CMake itself."
          fi

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          : > local.properties
          [ -n "${LASTFM_API_KEY:-}" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          [ -n "${LASTFM_SECRET:-}" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
          [ -n "${LISTEN_TOGETHER_SERVER:-}" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties
          exit 0

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleProdDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lossless-prod-debug
          path: app/build/outputs/apk/prod/debug/*.apk
          # See preview.yml: artifact storage is 500 MB for a free account and
          # a debug APK here is ~450 MB, because it is neither minified nor
          # split. Three days is long enough to download it and no longer.
          retention-days: 3
