name: Release

# Cuts a GitHub release from a tag, and the APK in it is what every installed
# copy of Lossless updates itself with.
#
#   tools/bump-version.sh minor      # 0.1.0 -> 0.2.0
#   git commit -am "Release 0.2.0"
#   git tag v0.2.0
#   git push && git push --tags      # <- this is what starts the build
#
# The tag is read by AppUpdateChecker (leading "v" stripped) and compared against
# the running build's versionName, so the three have to agree: the bump script
# writes the version, the tag names it, and this workflow names the APK after it.
# An APK whose file name does not start with `Lossless-` is invisible to the
# in-app updater — see BuildConfig.UPDATE_APK_PREFIX.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true
  # Called by `Cut release`, which moves the version and tags the result. It
  # cannot just push the tag and let the trigger above fire: a tag pushed with a
  # workflow's own GITHUB_TOKEN does not start another run.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.8)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A tag push already has the right ref; a dispatch or a call from
          # `Cut release` starts on the branch, so the tag is named explicitly.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships an Android SDK but not always this build's pieces.
      # sdkmanager is not on PATH in the runner's shell, so it is located
      # explicitly; if that fails at all, Gradle's own download is what actually
      # installs NDK and CMake on this project (it did, on the first run).
      - name: Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDK" ] || SDK="$(command -v sdkmanager || true)"
          if [ -x "$SDK" ]; then
            "$SDK" --install "platforms;android-37" "build-tools;37.0.0" \
              "cmake;3.22.1" "ndk;27.0.12077973" > /dev/null 2>&1 \
              || echo "::warning::sdkmanager installed only some of it — Gradle fetches the rest."
          else
            echo "::notice::No sdkmanager on PATH — Gradle fetches SDK, NDK and CMake itself."
          fi

      # The version the tag claims has to be the version in the build, or the
      # release will be published and then never offered to anybody: a phone
      # compares the tag against its own versionName and finds them equal.
      - name: Check the tag matches the build version
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          tag="${tag#v}"
          build_version="$(sed -n 's/^extra\["losslessVersionName"\] = "\([^"]*\)".*/\1/p' build.gradle.kts)"
          echo "tag=$tag build=$build_version"
          if [ "$tag" != "$build_version" ]; then
            echo "::error::The tag says $tag but build.gradle.kts says $build_version."
            echo "Run tools/bump-version.sh, commit, then tag the commit that did it."
            exit 1
          fi

      # Signing material comes from repository secrets and is written the way the
      # build already expects to find it. A release build refuses to fall back to
      # the debug key on purpose: an APK signed with a throwaway key installs
      # once and then fails every later update with a signature mismatch.
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set — see RELEASING.md for the four secrets this needs."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > lossless-release.jks
          # Checked before Gradle starts, not ten minutes into it. A blank
          # alias or key password used to surface as "KeytoolException: Failed
          # to read key  from store ... keystore password was incorrect" — the
          # double space is the empty alias, and nothing names the culprit.
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions."
              exit 1
            fi
          done
          if ! keytool -list -keystore lossless-release.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::That keystore opens, but alias \"$KEY_ALIAS\" is not in it with that password. Check KEY_ALIAS and KEY_PASSWORD."
            exit 1
          fi
          echo "::notice::Keystore, password and alias all check out."
          {
            echo "storeFile=lossless-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # Credentials and the party-server address, all optional: the build runs
      # without them and simply ships without last.fm scrubbing or a default
      # Listen Together server.
      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          # No sdk.dir line: the runner exports ANDROID_HOME/ANDROID_SDK_ROOT and
          # settings.gradle.kts reads those itself. Writing an empty sdk.dir here
          # would make it think this machine has no SDK and skip :app entirely.
          : > local.properties
          [ -n "${LASTFM_API_KEY:-}" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          [ -n "${LASTFM_SECRET:-}" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
          [ -n "${LISTEN_TOGETHER_SERVER:-}" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties
          exit 0

      - name: Build signed release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleProdRelease

      # Two files, named the way the updater looks for them:
      # `Lossless-<version>_arm64-v8a.apk` and `Lossless-<version>_armeabi-v7a.apk`.
      # The suffix is the whole contract — AppUpdateChecker downloads the split
      # whose ABI matches the device, and a name without one is read as a
      # universal build for the wrong processor.
      - name: Name the APKs
        id: apks
        run: |
          version="$(sed -n 's/^extra\["losslessVersionName"\] = "\([^"]*\)".*/\1/p' build.gradle.kts)"
          echo "Version: '$version'"
          if [ -z "$version" ]; then
            echo "::error::Could not read losslessVersionName from build.gradle.kts."
            exit 1
          fi
          mkdir -p out
          found=0
          while IFS= read -r apk; do
            base="$(basename "$apk" .apk)"
            # AGP puts the ABI in the middle of the file name
            # (app-arm64-v8a-prod-release.apk) and the updater wants it at the
            # end (Lossless-0.1.6_arm64-v8a.apk). The braces matter: an
            # unbraced `$version_` is read as a variable called `version_`,
            # which is unset, which is why every release asset so far has been
            # named `Lossless-arm64-v8a.apk` with no version in it at all.
            name=""
            for abi in armeabi-v7a arm64-v8a; do
              case "$base" in
                *"$abi"*) name="Lossless-${version}_${abi}.apk" ;;
              esac
            done
            if [ -z "$name" ]; then
              # Not expected: the build is configured as two splits. Uploaded
              # anyway rather than failing the release, but the log says so.
              echo "::warning::$(basename "$apk") names no ABI — is the splits block still two ABIs?"
              name="Lossless-${version}.apk"
            fi
            cp "$apk" "out/$name"
            echo "  $apk -> out/$name"
            found=$((found + 1))
          done < <(find app/build/outputs/apk/prod/release -type f -name '*.apk' | sort)
          # The counter, not `ls`: under `nullglob` a failed glob leaves a bare
          # `ls -1`, which lists the repository root and counts as success.
          if [ "$found" -eq 0 ]; then
            echo "::error::The build produced no APK. Output tree:"
            find app/build -maxdepth 4 | head -40
            exit 1
          fi
          ls -l out/
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # This body used to be a literal string right here, so every release said
      # the same thing: how to install it, and nothing about what changed. The
      # notes now come from `docs/release-notes/<version>.md` when that file
      # exists, and otherwise from the commit subjects since the previous tag.
      # The install blurb is still there, but as a footer under the change list
      # rather than instead of it.
      - name: Write the release notes
        run: |
          version="${{ steps.apks.outputs.version }}"
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          # Everything this release adds, measured against the last tag before
          # it. `git describe` rather than a version arithmetic because the tags
          # are not all prefixed the same way (0.1.6 vs v0.1.7).
          previous="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          echo "version=$version tag=$tag previous=${previous:-<none>}"

          notes="out/release-notes.md"
          mkdir -p out
          handwritten="docs/release-notes/${version}.md"

          if [ -f "$handwritten" ]; then
            echo "Using the handwritten notes in $handwritten."
            cp "$handwritten" "$notes"
          else
            echo "No $handwritten — summarising the commits since $previous."
            if [ -n "$previous" ]; then range="${previous}..HEAD"; else range="HEAD"; fi
            {
              echo "Lossless ${version}"
              echo
              echo "### What changed"
              echo
              # Merge commits say nothing; neither do the version bump itself,
              # preview/CI plumbing, or a bare "wip".
              git log --no-merges --pretty=format:'- %s' "$range" \
                | grep -viE '^- (release|bump|preview|check|ci)\b' \
                | grep -viE '^- (wip|merge)\b' \
                || echo "- Housekeeping only — no user-visible changes in this build."
              echo
            } > "$notes"
          fi

          {
            echo
            echo "---"
            echo
            echo "### Downloads"
            echo
            echo "Two builds, one per architecture: \`_arm64-v8a\` for any phone from"
            echo "roughly the last eight years, \`_armeabi-v7a\` for older 32-bit ones."
            echo "Both install over an earlier version and keep your library, downloads"
            echo "and sign-ins, and the in-app updater picks the right one by itself —"
            echo "or say yes to the prompt the app shows the next time it is opened."
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${tag}"
            fi
          } >> "$notes"

          echo "--- release notes ---"
          cat "$notes"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Lossless ${{ steps.apks.outputs.version }}
          draft: false
          prerelease: false
          # The body is ours now, changelog link included, so GitHub's own
          # generated notes are off — with a body they are ignored anyway.
          generate_release_notes: false
          body_path: out/release-notes.md
          files: out/*.apk
